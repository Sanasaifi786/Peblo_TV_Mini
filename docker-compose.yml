services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: peblo
      POSTGRES_PASSWORD: peblo
      POSTGRES_DB: peblo_tv
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peblo"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://peblo:peblo@db:5432/peblo_tv
      JWT_SECRET: peblo-secret-key-123
      JWT_EXPIRY_MINUTES: 1440
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /app/storage
      STORAGE_BASE_URL: http://localhost:8000/storage
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage
    command: >
      sh -c "alembic upgrade head &&
             python seed/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  cms:
    build:
      context: ./cms
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"

  viewer:
    build:
      context: ./viewer
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5174:5174"

volumes:
  db_data:
  storage_data:
